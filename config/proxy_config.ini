# Server Configuration File
# TCP Proxy Server - Configuration Settings

[Server]
# Listening address and port
listen_address = 127.0.0.1
listen_port = 8888

# Maximum number of queued connections
max_connections = 50

[Threading]
# Concurrency model: thread-per-connection
# Each client connection spawns a dedicated thread
concurrency_model = thread_per_connection

# Maximum active threads (0 = unlimited)
max_threads = 0

# Thread timeout in seconds (0 = no timeout)
thread_timeout = 0

[Logging]
# Enable/disable logging
logging_enabled = true

# Log file path
log_file = proxy.log

# Log level: DEBUG, INFO, WARN, ERROR
log_level = INFO

# Log thread IDs
log_thread_ids = true

# Log timestamps
log_timestamps = true

[Filtering]
# Domain blocklist file path
blocklist_file = config/blocked_domains.txt

# Enable domain filtering
filtering_enabled = true

# Case-sensitive domain matching
case_sensitive = false

# Subdomain matching (block www.example.com if example.com is blocked)
subdomain_matching = true

[HTTP]
# Buffer size for recv/send operations (bytes)
buffer_size = 8192

# HTTP version support
support_http_10 = true
support_http_11 = true

# Maximum request size (bytes, 0 = unlimited)
max_request_size = 1048576

# Request timeout (seconds)
request_timeout = 30

[Performance]
# Enable response streaming (no full buffering)
streaming_enabled = true

# Stream chunk size (bytes)
stream_chunk_size = 8192

# DNS cache enabled
dns_cache_enabled = false

# Connection reuse (keep-alive)
connection_reuse = false

[Cache]
# Response caching (not implemented)
caching_enabled = false
cache_size_mb = 0
cache_ttl_seconds = 0

[Security]
# Block recursive proxy requests
block_recursive_proxy = true

# Maximum URL length
max_url_length = 8192

# Maximum header size
max_header_size = 16384

[ErrorHandling]
# Return detailed error messages
detailed_errors = true

# Custom error pages directory (empty = default)
error_pages_dir = 

[Development]
# Debug mode (verbose logging)
debug_mode = false

# Simulate slow connections (ms delay)
simulate_delay_ms = 0
